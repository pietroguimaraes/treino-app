<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Treino</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <style>
:root {
  --fundo: #f4f6fb;
  --cartao: #ffffff;
  --texto: #1b2433;
  --suave: #6b7689;
  --acento: #2563eb;
  --acento-claro: #e8efff;
  --perigo: #c62828;
  --verde: #16a34a;
  --borda: #dfe4ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0f1421;
    --cartao: #171f2f;
    --texto: #e7ecf5;
    --suave: #9aa6ba;
    --acento: #60a5fa;
    --acento-claro: #1e2a44;
    --perigo: #f87171;
    --verde: #22c55e;
    --borda: #2a3550;
  }
}
:root[data-theme="dark"] {
  --fundo: #0f1421;
  --cartao: #171f2f;
  --texto: #e7ecf5;
  --suave: #9aa6ba;
  --acento: #60a5fa;
  --acento-claro: #1e2a44;
  --perigo: #f87171;
  --verde: #22c55e;
  --borda: #2a3550;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--fundo);
  color: var(--texto);
}

.topo {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--cartao);
  border-bottom: 1px solid var(--borda);
}
.marca { font-weight: 700; font-size: 18px; color: var(--acento); }
.topo button { width: auto; margin: 0; }

main {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 120px;
}

h2 { font-size: 22px; margin: 12px 0 8px; }
h3 { font-size: 17px; margin: 16px 0 8px; }

.cartao {
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
}
.centro { text-align: center; }
.suave { color: var(--suave); font-size: 14px; margin: 4px 0; }
.texto { white-space: pre-wrap; margin: 4px 0; }
a { color: var(--acento); }

label {
  display: block;
  font-size: 14px;
  color: var(--suave);
  margin: 10px 0;
}

input, select, textarea {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 12px;
  font: inherit;
  color: var(--texto);
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 10px;
}
textarea { resize: vertical; min-height: 60px; }

button {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 12px 16px;
  font: inherit;
  color: #fff;
  background: var(--acento);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
button.grande { font-size: 17px; padding: 16px; }
button.secundario-btn { background: var(--acento-claro); color: var(--acento); }
button.ghost { background: transparent; color: var(--acento); width: auto; padding: 8px 4px; }
button.ghost.perigo { color: var(--perigo); }

.item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  color: var(--texto);
  background: var(--cartao);
  border: 1px solid var(--borda);
}
.item strong { font-size: 16px; }
.item-linha { align-items: stretch; }
.item-linha .item { flex: 1; width: auto; margin: 0; }
.item-linha .ghost { width: auto; margin: 0; align-self: center; }
.lista { display: flex; flex-direction: column; gap: 8px; }

.linha {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.botoes { display: flex; gap: 8px; }

.grade {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.codigo {
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--acento);
}

.linha-s { margin: 4px 0; }
.linha-s.nao { color: var(--suave); }

/* Realizar treino */
.serie {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 52px;
  gap: 8px;
  align-items: end;
  padding: 8px 0;
  border-top: 1px dashed var(--borda);
}
.serie .num {
  font-weight: 700;
  color: var(--suave);
  padding-bottom: 14px;
}
.serie label { margin: 0; font-size: 12px; }
.serie input { padding: 10px; }
.check {
  width: 52px;
  height: 44px;
  margin: 0;
  padding: 0;
  background: var(--fundo);
  color: var(--suave);
  font-weight: 700;
}
.check.on { background: var(--verde); color: #fff; }

/* Fotos, gráfico e impressão */
.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fotos img { width: 100%; border-radius: 8px; }
.grafico svg { width: 100%; height: auto; }
.grafico text { font-size: 11px; fill: var(--suave); }
.so-impressao { display: none; }

@media print {
  .so-impressao { display: block; }
  body * { visibility: hidden; }
  .so-impressao, .so-impressao * { visibility: visible; }
  .so-impressao { position: absolute; left: 0; top: 0; width: 100%; color: #000; }
  .so-impressao table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .so-impressao th, .so-impressao td { border: 1px solid #999; padding: 4px; font-size: 12px; text-align: left; }
}

/* Banner de descanso */
.descanso {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: #1b2433;
  color: #fff;
}
.descanso strong {
  font-size: 26px;
  font-variant-numeric: tabular-nums;
}
.ghost-claro {
  width: auto;
  margin: 0;
  background: #fff;
  color: #1b2433;
}
.status-nuvem { font-size: 12px; color: var(--suave); margin-left: auto; margin-right: 12px; white-space: nowrap; }
.aviso { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: 90%; background: var(--texto); color: var(--fundo); padding: 12px 16px; border-radius: 10px; z-index: 50; font-size: 14px; }
.fundo-dialogo { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
.dialogo { background: var(--cartao); color: var(--texto); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; box-sizing: border-box; }
.dialogo label { display: block; }
.dialogo input { display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); font: inherit; box-sizing: border-box; }
.dialogo .botoes { justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>
  <header class="topo">
    <span class="marca">Treino</span>
    <span id="status-nuvem" class="status-nuvem"></span>
    <button id="btn-sair" class="ghost" hidden>Sair</button>
  </header>

  <main id="app"></main>

  <div id="descanso" class="descanso" hidden>
    <span>Descanso</span>
    <strong id="descanso-tempo">00:00</strong>
    <span class="botoes">
      <button id="descanso-mais" class="ghost-claro">+15 s</button>
      <button id="descanso-pular" class="ghost-claro">Pular</button>
    </span>
  </div>

  <script>
// Treino: um app com dois perfis.
// Personal monta os treinos, a biblioteca de exercícios, as avaliações, a mensalidade e o Pix dos alunos.
// Aluno realiza os treinos, registra o que fez, vê o próprio progresso e deixa um feedback.
// Os dados ficam no navegador deste aparelho (localStorage). Dentro do Claude, também são salvos na sua conta.

const CHAVE_DADOS = 'treino_app_v1';
const CHAVE_SESSAO = 'treino_app_sessao';
const CHAVE_EXECUCAO = 'treino_app_execucao';

const GRUPOS = ['Peito', 'Costas', 'Pernas', 'Glúteos', 'Ombros', 'Braços', 'Abdômen', 'Cardio', 'Outro'];

const PERGUNTAS_ANAMNESE = [
  ['objetivo', 'Qual é o seu objetivo?'],
  ['atividade', 'Já pratica alguma atividade física? Qual e com que frequência?'],
  ['lesoes', 'Tem alguma lesão, dor ou cirurgia recente?'],
  ['saude', 'Tem alguma doença ou usa algum medicamento de uso contínuo?'],
  ['sono', 'Quantas horas costuma dormir por noite?'],
  ['alimentacao', 'Como é a sua alimentação no dia a dia?'],
  ['fumo', 'Fuma ou consome bebida alcoólica? Com que frequência?'],
  ['observacoes', 'Observações'],
];

const MODELOS_AVALIACAO = {
  fisica: {
    nome: 'Avaliação física',
    campos: [
      ['peso', 'Peso (kg)'],
      ['altura', 'Altura (cm)'],
      ['gordura', 'Gordura corporal (%)'],
      ['braco', 'Braço (cm)'],
      ['cintura', 'Cintura (cm)'],
      ['quadril', 'Quadril (cm)'],
      ['coxa', 'Coxa (cm)'],
      ['panturrilha', 'Panturrilha (cm)'],
      ['fcRepouso', 'Frequência cardíaca em repouso (bpm)'],
      ['pa', 'Pressão arterial (ex.: 12x8)'],
    ],
  },
  postural: {
    nome: 'Avaliação postural',
    campos: [
      ['cabeca', 'Cabeça'],
      ['ombros', 'Ombros'],
      ['coluna', 'Coluna'],
      ['pelve', 'Pelve'],
      ['joelhos', 'Joelhos'],
      ['pes', 'Pés'],
    ],
  },
  neuromotora: {
    nome: 'Avaliação neuromotora',
    campos: [
      ['flexibilidade', 'Flexibilidade (cm)'],
      ['flexoes', 'Flexões em 1 minuto (quantidade)'],
      ['abdominais', 'Abdominais em 1 minuto (quantidade)'],
      ['equilibrio', 'Equilíbrio (segundos)'],
      ['agilidade', 'Agilidade (segundos)'],
    ],
  },
};

// Modelos fixos de treino (não usam IA). Cada exercício: [nome, séries, reps].
const MODELOS_TREINO = {
  corpoInteiro: {
    nome: 'Corpo inteiro (iniciante)',
    exercicios: [
      ['Agachamento', 3, '10-12'],
      ['Supino reto', 3, '10-12'],
      ['Remada curvada', 3, '10-12'],
      ['Desenvolvimento', 3, '10-12'],
      ['Prancha', 3, '30 s'],
    ],
  },
  divisaoA: {
    nome: 'Divisão A: peito, ombro e tríceps',
    exercicios: [
      ['Supino reto', 4, '8-10'],
      ['Supino inclinado', 3, '10-12'],
      ['Desenvolvimento', 3, '10-12'],
      ['Elevação lateral', 3, '12-15'],
      ['Tríceps na polia', 3, '10-12'],
    ],
  },
  divisaoB: {
    nome: 'Divisão B: costas e bíceps',
    exercicios: [
      ['Puxada frontal', 4, '8-10'],
      ['Remada curvada', 3, '8-10'],
      ['Remada unilateral', 3, '10-12'],
      ['Rosca direta', 3, '10-12'],
      ['Rosca martelo', 3, '12'],
    ],
  },
  divisaoC: {
    nome: 'Divisão C: pernas e abdômen',
    exercicios: [
      ['Agachamento', 4, '8-10'],
      ['Leg press', 3, '10-12'],
      ['Cadeira extensora', 3, '12-15'],
      ['Mesa flexora', 3, '10-12'],
      ['Abdominal supra', 3, '15'],
    ],
  },
};

const app = document.getElementById('app');
const btnSair = document.getElementById('btn-sair');
const descansoBox = document.getElementById('descanso');
const descansoTempo = document.getElementById('descanso-tempo');
const descansoMais = document.getElementById('descanso-mais');
const descansoPular = document.getElementById('descanso-pular');

let db = carregarDados();
let sessao = lerJSON(CHAVE_SESSAO);      // { papel: 'personal' } ou { papel: 'aluno', alunoId }
let execucao = lerJSON(CHAVE_EXECUCAO);  // treino que o aluno está fazendo agora
let rascunho = null;                     // treino em edição (personal)
let fotosTemp = [];                      // fotos escolhidas na avaliação em andamento
let rota = { tela: 'inicio' };
let timerDescanso = null;
let descansoRestante = 0;
let audioCtx = null;

// ---------- armazenamento ----------

function lerJSON(chave) {
  try { return JSON.parse(localStorage.getItem(chave)) || null; } catch (e) { return null; }
}

function gravarJSON(chave, valor) {
  try {
    if (valor) localStorage.setItem(chave, JSON.stringify(valor));
    else localStorage.removeItem(chave);
    return true;
  } catch (e) {
    return false;
  }
}

function carregarDados() {
  const d = lerJSON(CHAVE_DADOS) || {};
  return {
    personal: d.personal || null,
    alunos: d.alunos || [],
    treinos: d.treinos || [],
    sessoes: d.sessoes || [],
    exercicios: d.exercicios || [],
    anamneses: d.anamneses || [],
    avaliacoes: d.avaliacoes || [],
    config: d.config || {},
  };
}

function salvarDados() {
  const ok = gravarJSON(CHAVE_DADOS, db);
  agendarNuvem();
  if (ok || nuvem.ativa) return true;
  avisar('Não consegui salvar neste aparelho. Apague algumas avaliações com foto e tente de novo.');
  return false;
}

// ---------- conta (sincronização entre aparelhos) ----------
// A conta fica no Supabase, com e-mail e senha. Os dados vão para ela e voltam para o celular e o computador.

const CONTA = {
  url: 'https://uhywfpwkkktpmtqgkpbe.supabase.co',
  chave: 'sb_publishable_Kr6fIQc7kE040GfuWvndcw_inhGTI9Q',
};

const MSG_OFFLINE = 'Sem conexão com a conta. Os dados continuam salvos aqui.';

let sb = null;          // cliente do Supabase
let usuarioId = null;   // id de quem está logado

const nuvem = {
  ativa: false,
  carregada: false,     // só envia para a conta depois de ler a conta, para não apagar nada lá
  ultimoJson: '',
  fotosNaNuvem: new Set(),
  fotosCache: new Map(),
  timer: null,
  fila: Promise.resolve(),
  pendente: false,
  canal: null,
  ultimoSnapshot: 0,
};

function indicarNuvem(texto) {
  const el = document.getElementById('status-nuvem');
  if (el) el.textContent = texto;
}

function ordenarChaves(v) {
  if (Array.isArray(v)) return v.map(ordenarChaves);
  if (v && typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v).sort()) o[k] = ordenarChaves(v[k]);
    return o;
  }
  return v;
}

function hashTexto(t) {
  let h = 2166136261;
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36) + t.length.toString(36);
}

// As fotos são grandes: ficam numa tabela própria. No registro do treino ficam só os códigos.
function separarFotos(dados) {
  const corpo = JSON.parse(JSON.stringify(dados));
  const fotos = [];
  for (const av of corpo.avaliacoes || []) {
    av.fotos = (av.fotos || []).map(f => {
      const id = String(av.id || '') + '-' + hashTexto(f);
      fotos.push({ id, dataUrl: f });
      return id;
    });
  }
  return { corpo, fotos };
}

function temAlgumDado() {
  return !!(db.personal || db.alunos.length || db.treinos.length || db.sessoes.length
    || db.exercicios.length || db.avaliacoes.length || db.anamneses.length);
}

function emLotes(lista, tamanho) {
  const lotes = [];
  for (let i = 0; i < lista.length; i += tamanho) lotes.push(lista.slice(i, i + tamanho));
  return lotes;
}

// Traz os dados da conta para este aparelho. Se alguma foto não puder ser lida, não aplica nada.
async function aplicarDoNuvem(corpo) {
  const dados = JSON.parse(JSON.stringify(corpo));
  const ids = [];
  for (const av of dados.avaliacoes || []) for (const fid of av.fotos || []) ids.push(fid);
  const faltam = [...new Set(ids)].filter(id => !nuvem.fotosCache.has(id));
  for (const lote of emLotes(faltam, 50)) {
    const { data, error } = await sb.from('treino_fotos').select('foto_id, data_url').in('foto_id', lote);
    if (error) throw error;
    for (const r of data) nuvem.fotosCache.set(r.foto_id, r.data_url);
  }
  for (const av of dados.avaliacoes || []) {
    const lista = [];
    for (const fid of av.fotos || []) {
      const url = nuvem.fotosCache.get(fid);
      if (!url) throw new Error('foto ausente');
      lista.push(url);
    }
    av.fotos = lista;
  }
  nuvem.fotosNaNuvem = new Set(ids);
  db = {
    personal: dados.personal || null,
    alunos: dados.alunos || [],
    treinos: dados.treinos || [],
    sessoes: dados.sessoes || [],
    exercicios: dados.exercicios || [],
    anamneses: dados.anamneses || [],
    avaliacoes: dados.avaliacoes || [],
    config: dados.config || {},
  };
  nuvem.ultimoJson = JSON.stringify(ordenarChaves(corpo));
  gravarJSON(CHAVE_DADOS, db);
}

function agendarNuvem() {
  if (!nuvem.ativa || !nuvem.carregada) return;
  nuvem.pendente = true;
  indicarNuvem('Salvando…');
  clearTimeout(nuvem.timer);
  nuvem.timer = setTimeout(enfileirarEnvio, 700);
}

function enfileirarEnvio() {
  clearTimeout(nuvem.timer);
  nuvem.fila = nuvem.fila.then(enviarParaNuvem).catch(() => {
    indicarNuvem('Não consegui salvar na conta agora. Vou tentar de novo.');
    setTimeout(agendarNuvem, 5000);
  });
}

async function enviarParaNuvem() {
  if (!nuvem.carregada || !sb) return;
  const { corpo, fotos } = separarFotos(db);
  const json = JSON.stringify(ordenarChaves(corpo));
  if (json === nuvem.ultimoJson) { nuvem.pendente = false; indicarNuvem('Salvo na sua conta'); return; }
  // As fotos nunca são apagadas: versões antigas podem usá-las.
  for (const f of fotos) {
    if (!nuvem.fotosNaNuvem.has(f.id)) {
      const { error } = await sb.from('treino_fotos').upsert({ user_id: usuarioId, foto_id: f.id, data_url: f.dataUrl });
      if (error) throw error;
      nuvem.fotosNaNuvem.add(f.id);
      nuvem.fotosCache.set(f.id, f.dataUrl);
    }
  }
  const { error } = await sb.from('treino_dados').upsert({
    user_id: usuarioId,
    dados: corpo,
    atualizado_em: new Date().toISOString(),
  });
  if (error) throw error;
  // Versão: no máximo uma a cada 10 minutos (a tabela guarda as últimas 200).
  if (Date.now() - nuvem.ultimoSnapshot > 10 * 60 * 1000) {
    const { error: erroVersao } = await sb.from('treino_historico').insert({ user_id: usuarioId, dados: corpo });
    if (erroVersao) throw erroVersao;
    nuvem.ultimoSnapshot = Date.now();
  }
  nuvem.ultimoJson = json;
  nuvem.pendente = false;
  indicarNuvem('Salvo na sua conta');
}

// Quando o mesmo treino muda no outro aparelho, a tela deste aparelho se atualiza.
function ouvirNuvem(linha) {
  if (!linha || !linha.dados) return;
  const corpo = linha.dados;
  if (JSON.stringify(ordenarChaves(corpo)) === nuvem.ultimoJson) return;
  nuvem.fila = nuvem.fila.then(async () => {
    if (nuvem.pendente) return;
    try {
      await aplicarDoNuvem(corpo);
      render();
      indicarNuvem('Salvo na sua conta');
    } catch (e) {
      indicarNuvem('Não consegui atualizar pela conta agora');
    }
  });
}

function assinarNuvem() {
  if (!usuarioId || !sb || nuvem.canal) return;
  nuvem.canal = sb.channel('treino-' + usuarioId)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'treino_dados', filter: 'user_id=eq.' + usuarioId },
      (p) => ouvirNuvem(p.new))
    .subscribe((estado) => {
      if (estado === 'CHANNEL_ERROR' || estado === 'TIMED_OUT') indicarNuvem(MSG_OFFLINE);
    });
}

function mensagemErroConta(erro) {
  const m = ((erro && erro.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'E-mail ou senha errados.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Esse e-mail já tem conta. Entre com a senha.';
  if (m.includes('at least') || m.includes('least 6')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (m.includes('email not confirmed')) return 'Confirme o e-mail que chegou na sua caixa antes de entrar.';
  if (m.includes('fetch') || m.includes('network')) return MSG_OFFLINE;
  return 'Não consegui: ' + ((erro && erro.message) || 'erro desconhecido');
}

// Ao abrir: 'sem-conta' manda para a tela de entrar; 'ok' e 'offline' usam os dados que estiverem neste aparelho.
async function iniciarConta() {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    indicarNuvem(MSG_OFFLINE);
    return 'offline';
  }
  if (!sb) sb = window.supabase.createClient(CONTA.url, CONTA.chave);
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) return 'sem-conta';
  usuarioId = data.session.user.id;
  nuvem.ativa = true;

}

function avisar(texto) {

function abrirDialogo(html) {
  return new Promise(resolve => {
    const fundo = document.createElement('div');
    fundo.className = 'fundo-dialogo';
    fundo.innerHTML = '<div class="dialogo" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(fundo);
    const campo = fundo.querySelector('input');
    const fechar = (valor) => {
      document.removeEventListener('keydown', teclar);
      fundo.remove();
      resolve(valor);
    };
    const teclar = (e) => { if (e.key === 'Escape') fechar(null); };
    document.addEventListener('keydown', teclar);
    fundo.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-r]');
      if (!b) return;
      if (b.dataset.r === 'nao') return fechar(null);
      fechar(campo ? campo.value : true);
    });
    if (campo) campo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); fechar(campo.value); }
    });
    (campo || fundo.querySelector('[data-r="sim"]')).focus();
  });
}

function pedirConfirmacao(texto) {

function novoId() {

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({

}

function txt(v) {

}

function campo(f, nome) {
  const el = f.querySelector(`[name="${nome}"]`);

}

function numero(v, padrao) {
  const n = parseFloat(String(v ?? '').replace(',', '.'));
  return Number.isFinite(n) ? n : padrao;
}

function numeroPuro(v) {
  return /^\s*\d+([.,]\d+)?\s*$/.test(String(v ?? '')) ? numero(v, NaN) : NaN;
}

function linkSeguro(u) {

function youtubeBusca(nome) {

function codigoAluno() {
  const letras = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let codigo;
  do {
    codigo = '';
    for (let i = 0; i < 6; i++) codigo += letras[Math.floor(Math.random() * letras.length)];
  } while (db.alunos.some(a => a.codigo === codigo));
  return codigo;
}

function tempo(seg) {
  const m = Math.floor(seg / 60);
  const s = seg % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function dataCurta(iso) {

}

function dataBR(s) {

}

function dataHoje() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function mesAtual() {

function mesBR(m) {

}

function periodoTxt(t) {

// ---------- Pix (copia e cola, sem serviço pago) ----------

function crc16(texto) {
  let crc = 0xFFFF;
  for (let i = 0; i < texto.length; i++) {
    crc ^= texto.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}

function campoPix(id, valor) {
  return id + String(valor.length).padStart(2, '0') + valor;
}

function semAcento(s) {
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').trim();
}

function pixCopiaCola({ chave, nome, cidade, valor, txid }) {
  const conta = campoPix('00', 'br.gov.bcb.pix') + campoPix('01', chave);
  let p = campoPix('00', '01') + campoPix('26', conta) + campoPix('52', '0000') + campoPix('53', '986');
  if (valor > 0) p += campoPix('54', valor.toFixed(2));
  p += campoPix('58', 'BR');
  p += campoPix('59', semAcento(nome).slice(0, 25));
  p += campoPix('60', semAcento(cidade).slice(0, 15));
  p += campoPix('62', campoPix('05', txid));
  p += '6304';
  return p + crc16(p);
}

// ---------- descanso entre séries ----------

function iniciarDescanso(seg) {
  pararDescanso();
  if (!seg || seg <= 0) return;
  descansoRestante = seg;
  atualizarDescanso();
  descansoBox.hidden = false;
  timerDescanso = setInterval(() => {
    descansoRestante -= 1;
    atualizarDescanso();
    if (descansoRestante <= 0) {
      pararDescanso();
      avisarFimDescanso();
    }
  }, 1000);
}

function atualizarDescanso() {
  descansoTempo.textContent = tempo(Math.max(0, descansoRestante));
}

function ajustarDescanso(delta) {
  if (!timerDescanso) return;
  descansoRestante = Math.max(1, descansoRestante + delta);
  atualizarDescanso();
}

function pararDescanso() {
  clearInterval(timerDescanso);
  timerDescanso = null;
  descansoBox.hidden = true;
}

function avisarFimDescanso() {
  bipar();
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}

function garantirAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    audioCtx = null;
  }
}

function bipar() {
  try {
    garantirAudio();
    if (!audioCtx) return;
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const volume = audioCtx.createGain();
      osc.frequency.value = 880;
      volume.gain.value = 0.3;
      osc.connect(volume);
      volume.connect(audioCtx.destination);
      const inicio = audioCtx.currentTime + i * 0.35;
      osc.start(inicio);
      osc.stop(inicio + 0.2);
    }
  } catch (e) {
    // sem som neste aparelho: o aviso continua pela vibração
  }
}

// ---------- progresso e histórico ----------

function nomesExercicios(alunoId) {
  const set = new Set();
  db.sessoes.filter(s => s.alunoId === alunoId).forEach(s => s.exercicios.forEach(e => set.add(e.nome)));
  return [...set].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function progressoPontos(alunoId, nome) {
  return db.sessoes
    .filter(s => s.alunoId === alunoId)
    .sort((x, y) => x.data.localeCompare(y.data))
    .map(s => {
      const ex = s.exercicios.find(e => e.nome === nome);
      if (!ex) return null;
      const cargas = ex.series.filter(x => x.feito).map(x => numero(x.carga, NaN)).filter(v => Number.isFinite(v) && v > 0);
      return cargas.length ? { data: s.data, carga: Math.max(...cargas) } : null;
    })
    .filter(Boolean);
}

function graficoSVG(pontos) {
  const W = 320, H = 160, margem = 28;
  const valores = pontos.map(p => p.carga);
  const min = Math.min(...valores), max = Math.max(...valores);
  const faixa = max - min || 1;
  const x = i => pontos.length === 1 ? W / 2 : margem + i * (W - 2 * margem) / (pontos.length - 1);
  const y = v => max === min ? H / 2 : H - margem - (v - min) / faixa * (H - 2 * margem);
  const linha = pontos.length > 1
    ? `<polyline points="${pontos.map((p, i) => `${x(i).toFixed(1)},${y(p.carga).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--acento)" stroke-width="2"/>`
    : '';
  const bolinhas = pontos.map((p, i) => `
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.carga).toFixed(1)}" r="4" fill="var(--acento)">
      <title>${dataBR(p.data.slice(0, 10))}: ${p.carga} kg</title>
    </circle>`).join('');
  return `
    <div class="grafico">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução da carga">
        ${linha}${bolinhas}
        <text x="2" y="14">${max} kg</text>
        <text x="2" y="${H - 6}">${min} kg</text>
      </svg>
    </div>`;
}

function ultimaVez(nome, alunoId) {
  const sess = db.sessoes.filter(s => s.alunoId === alunoId).sort((x, y) => y.data.localeCompare(x.data));
  for (const s of sess) {
    const ex = s.exercicios.find(e => e.nome === nome);
    if (!ex) continue;
    const feitas = ex.series.filter(x => x.feito);
    if (!feitas.length) continue;
    const melhor = feitas.reduce((m, x) => (numero(x.carga, 0) > numero(m.carga, 0) ? x : m), feitas[0]);
    return `${dataBR(s.data.slice(0, 10))}: ${feitas.length} série(s) · ${esc(melhor.reps) || '—'} reps · ${esc(melhor.carga) || '—'} kg`;
  }
  return '';
}

// ---------- fotos ----------

function comprimirFoto(arquivo) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, 800 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * escala);
      canvas.height = Math.round(img.height * escala);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('imagem inválida'));
    };
    img.src = url;
  });
}

    ? `<section class="cartao">

function calcularIMC(campos) {
  const peso = numero(campos.peso, NaN);
  const altura = numero(campos.altura, NaN);
  if (!(peso > 0) || !(altura > 0)) return '';
  const imc = peso / ((altura / 100) ** 2);
  return `<p class="linha-s"><strong>IMC:</strong> ${imc.toFixed(1).replace('.', ',')}</p>`;
}

function telaAvaliacoes() {
  const alunoId = rota.alunoId;
  const a = alunoPorId(alunoId);
  if (!a) { rota = { tela: 'inicio' }; return telaInicio(); }
  const personal = sessao && sessao.papel === 'personal';
  const volta = personal ? 'voltarAlunoDetalhe' : 'voltarInicioAluno';
  const anam = db.anamneses.find(x => x.alunoId === alunoId);
  const respostas = anam
    ? perguntasAnamnese().map(p => {
        const r = anam.respostas[p.id];
        return `<p><strong>${esc(p.texto)}</strong><br><span class="texto">${r ? esc(r) : '<span class="suave">Não respondido</span>'}</span></p>`;
      }).join('')
    : '<p class="suave">Nenhuma anamnese ainda.</p>';
  const avs = db.avaliacoes
    .filter(x => x.alunoId === alunoId)
    .sort((x, y) => y.data.localeCompare(x.data) || (y.criadoEm || '').localeCompare(x.criadoEm || ''));
  const variacao = (av, anterior, k) => {
    if (!anterior) return '';
    const atual = numeroPuro(av.campos[k]);
    const antes = numeroPuro(anterior.campos[k]);
    if (!Number.isFinite(atual) || !Number.isFinite(antes)) return '';
    const d = atual - antes;
    if (d === 0) return ' (sem mudança)';
    return ` (${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1).replace('.', ',')} desde ${dataBR(anterior.data)})`;
  };
  const cards = avs.length
    ? avs.map((av, i) => {
        const modelo = MODELOS_AVALIACAO[av.tipo];
        if (!modelo) return '';
        const anterior = avs.slice(i + 1).find(x => x.tipo === av.tipo);
        const linhas = modelo.campos
          .filter(([k]) => txt(av.campos[k]))
          .map(([k, t]) => `<p class="linha-s"><span class="suave">${esc(t)}:</span> ${esc(av.campos[k])}${variacao(av, anterior, k)}</p>`)
          .join('');
        const imc = av.tipo === 'fisica' ? calcularIMC(av.campos) : '';
        const fotos = (av.fotos || []).length
          ? `<div class="fotos">${av.fotos.map(f => `<img src="${f}" alt="Foto da avaliação">`).join('')}</div>`
          : '';
        return `
          <section class="cartao">
            <div class="linha">
              <h3>${esc(modelo.nome)}</h3>
              ${personal ? `<button class="ghost perigo" data-acao="excluirAvaliacao" data-id="${esc(av.id)}">Excluir</button>` : ''}
            </div>
            <p class="suave">${dataBR(av.data)}</p>
            ${imc}
            ${linhas || '<p class="suave">Sem valores preenchidos.</p>'}
            ${fotos}
          </section>`;
      }).join('')
    : '<p class="suave">Nenhuma avaliação ainda.</p>';
  const novas = personal ? `
    <h3>Nova avaliação</h3>
    <div class="grade">
      <button class="secundario-btn" data-acao="avaliacaoNova" data-tipo="fisica">Física</button>
      <button class="secundario-btn" data-acao="avaliacaoNova" data-tipo="postural">Postural</button>
      <button class="secundario-btn" data-acao="avaliacaoNova" data-tipo="neuromotora">Neuromotora</button>
    </div>` : '';
  return `
    <button class="ghost" data-acao="${volta}">← Voltar</button>
    <h2>Avaliações e anamnese de ${esc(a.nome)}</h2>
    <section class="cartao">
      <div class="linha">
        <h3>Anamnese</h3>
        ${personal ? '<button class="ghost" data-acao="anamneseEditar">Editar</button>' : ''}
      </div>
      ${anam ? `<p class="suave">Atualizada em ${dataBR(anam.data)}</p>` : ''}
      ${respostas}
    </section>
    ${novas}
    <h3>Avaliações</h3>
    ${cards}`;
}

function alunosEmAtraso() {
  const mes = mesAtual();
  const dia = new Date().getDate();
  return db.alunos.filter(a => {
    const p = a.pagamento;
    if (!p || !(Number(p.dia) >= 1)) return false;
    return !(p.meses || []).includes(mes) && dia > Number(p.dia);
  });
}

        </label>
        <label>Kg
          <input data-real="carga" data-ex="${esc(ex.id)}" data-j="${j}" value="${esc(s.carga)}" inputmode="decimal">
        </label>
        <button class="check ${s.feito ? 'on' : ''}" data-acao="feito" data-ex="${esc(ex.id)}" data-j="${j}"
          aria-label="Marcar série ${j + 1} como feita">${s.feito ? '✔' : 'OK'}</button>
      </div>`).join('');
    const extra = [ex.reps && `${ex.reps} reps`, ex.carga && `${ex.carga} kg`, ex.descanso && `descanso ${ex.descanso} s`, ex.obs]
      .filter(Boolean).join(' · ');
    const video = ex.video
      ? `<p class="linha-s"><a href="${esc(ex.video)}" target="_blank" rel="noopener">▶ Ver vídeo do exercício</a></p>`
      : `<p class="linha-s"><a href="${esc(youtubeBusca(ex.nome))}" target="_blank" rel="noopener">▶ Buscar vídeo no YouTube</a></p>`;
    const ultima = ultimaVez(ex.nome, execucao.alunoId);
    return `
      <section class="cartao">
        <h3>${i + 1}. ${esc(ex.nome)}</h3>
        <p class="suave">Plano: ${esc(ex.series)} séries${extra ? ' · ' + esc(extra) : ''}</p>
        ${ultima ? `<p class="suave">Última vez: ${ultima}</p>` : ''}
        ${video}
        ${linhas}
      </section>`;
  }).join('');
  return `
    <button class="ghost" data-acao="cancelarTreino">← Cancelar</button>
    <h2>${esc(t.nome)}</h2>
    <p class="suave">Marque cada série ao terminar. Os valores já vêm do plano; ajuste se fez diferente.</p>
    ${blocos}
    <section class="cartao">
      <label>Como foi o treino? Conte para o seu personal (opcional)
        <textarea data-fb rows="3">${esc(execucao.feedback || '')}</textarea>
      </label>
    </section>
    <button class="grande" data-acao="finalizarTreino">Finalizar treino</button>`;
}

function telaHistorico() {
  const alunoId = rota.alunoId;
  const a = alunoPorId(alunoId);
  const sess = db.sessoes
    .filter(s => s.alunoId === alunoId)
    .sort((x, y) => y.data.localeCompare(x.data));
  const lista = sess.length
    ? sess.map(s => {
        const todas = s.exercicios.flatMap(ex => ex.series);
        const feitas = todas.filter(x => x.feito).length;
        return `
          <button class="item" data-acao="abrirSessao" data-id="${esc(s.id)}">
            <strong>${esc(s.treinoNome)}</strong>
            <span class="suave">${dataCurta(s.data)} · ${feitas}/${todas.length} séries${s.feedback ? ' · com feedback' : ''}</span>
          </button>`;
      }).join('')
    : '<p class="suave">Nenhum treino registrado ainda.</p>';
  const volta = sessao && sessao.papel === 'aluno' ? 'voltarInicioAluno' : 'voltarAlunoDetalhe';
  return `
    <button class="ghost" data-acao="${volta}">← Voltar</button>
    <h2>Histórico${a ? ' de ' + esc(a.nome) : ''}</h2>
    <div class="lista">${lista}</div>`;
}

function telaSessaoDetalhe() {
  const s = db.sessoes.find(x => x.id === rota.sessaoId);
  if (!s) { rota = { tela: 'inicio' }; return telaInicio(); }
  const blocos = s.exercicios.map(ex => `
    <section class="cartao">
      <h3>${esc(ex.nome)}</h3>
      ${ex.series.map((x, j) => `
        <p class="linha-s ${x.feito ? '' : 'nao'}">
          Série ${j + 1}: ${x.feito ? `${esc(x.reps)} reps · ${esc(x.carga) || '—'} kg ✔` : 'não feita'}
        </p>`).join('')}
    </section>`).join('');
  const feedback = s.feedback
    ? `<section class="cartao"><h3>Feedback do aluno</h3><p class="texto">${esc(s.feedback)}</p></section>`
    : '';
  return `
    <button class="ghost" data-acao="voltarHistorico">← Histórico</button>
    <h2>${esc(s.treinoNome)}</h2>
    <p class="suave">${dataCurta(s.data)} · ${Math.round(s.duracaoSeg / 60)} min</p>
    ${feedback}
    ${blocos}`;
}

function telaBackup() {
  const volta = sessao && sessao.papel === 'personal' ? 'voltarPersonal'
    : sessao && sessao.papel === 'aluno' ? 'voltarInicioAluno'
    : 'voltarInicio';
  return `
    <button class="ghost" data-acao="${volta}">← Voltar</button>
    <h2>Backup dos dados</h2>
    <section class="cartao">
      <p>O backup é um arquivo com todos os alunos, treinos, exercícios, avaliações (com fotos), anamneses, pagamentos, configurações e histórico. Guarde em um lugar seguro, como uma pasta do OneDrive ou um pendrive.</p>

    // Dentro do visualizador do Claude, o download de arquivo passa pela permissão "downloads".
    try {
      const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename: nome, data: texto });
        return;
      }
    } catch (e) {
      if (e && e.code === 'declined') return;
    }
    // Abertura direta do arquivo no computador: download comum.
    const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

    const lista = execucao.series[el.dataset.ex];
    if (!ex || !lista) return;
    const j = Number(el.dataset.j);
    lista[j].feito = !lista[j].feito;
    gravarExecucao();
    // descanso só entre séries: não começa depois da última série do exercício

  async finalizarTreino() {
    if (!execucao) return ir({ tela: 'alunoHome' });
    const t = db.treinos.find(x => x.id === execucao.treinoId);
    if (!t) {
      execucao = null;
      gravarExecucao();
      return ir({ tela: 'alunoHome' });
    }
    const todas = Object.values(execucao.series).flat();
    const feitas = todas.filter(s => s.feito).length;
    if (feitas < todas.length && !(await pedirConfirmacao(`Você marcou ${feitas} de ${todas.length} séries. Finalizar assim?`))) return;

    const registro = {
      id: novoId(),
      alunoId: execucao.alunoId,
      treinoId: t.id,
      treinoNome: t.nome,
      data: new Date().toISOString(),
      duracaoSeg: Math.round((Date.now() - execucao.inicio) / 1000),
      feedback: txt(execucao.feedback),
      exercicios: t.exercicios.map(ex => ({
        nome: ex.nome,
        series: (execucao.series[ex.id] || []).map(s => ({ reps: s.reps, carga: s.carga, feito: s.feito })),
      })),
    };
    db.sessoes.push(registro);
    if (!salvarDados()) return;
    const alunoId = execucao.alunoId;
    execucao = null;
    gravarExecucao();
    pararDescanso();
    ir({ tela: 'sessaoDetalhe', sessaoId: registro.id, alunoId });
  },

function textoTreino(t) {
  let s = `*${t.nome}*${periodoTxt(t)}\n`;
  t.exercicios.forEach((e, i) => {
    s += `\n${i + 1}. ${e.nome}: ${e.series} x ${e.reps || '—'}`;
    if (e.carga) s += ` · ${e.carga} kg`;
    if (e.descanso) s += ` · descanso ${e.descanso} s`;
    if (e.obs) s += ` · ${e.obs}`;
    if (e.video) s += `\n   ${e.video}`;
  });
  return s;
}

async function aplicarModelo(id) {
  const modelo = MODELOS_TREINO[id];
  if (!modelo || !rascunho) return;
  if (rascunho.exercicios.length && !(await pedirConfirmacao('Substituir os exercícios atuais pelos do modelo?'))) return;
  rascunho.exercicios = modelo.exercicios.map(([nome, series, reps]) => {
    const lib = db.exercicios.find(x => x.nome.toLowerCase() === nome.toLowerCase());
    return {
      id: novoId(), nome, series: String(series), reps, carga: '', descanso: '60', obs: '',
      video: (lib && lib.video) || '',
    };
  });
  if (!txt(rascunho.nome)) rascunho.nome = modelo.nome;
  render();
}

// ---------- envio de formulários ----------

const formularios = {
  async entrar(form) {
    if (!sb) { avisar(MSG_OFFLINE); return; }
    const { error } = await sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.senha.value });
    if (error) { avisar(mensagemErroConta(error)); return; }
    await arrancar();
  },

  async criarConta(form) {
    if (!sb) { avisar(MSG_OFFLINE); return; }
    const { data, error } = await sb.auth.signUp({ email: form.email.value.trim(), password: form.senha.value });
    if (error) { avisar(mensagemErroConta(error)); return; }
    if (!data.session) {
      avisar('Conta criada. Confirme o e-mail que chegou na sua caixa e depois entre.');
      ir({ tela: 'entrar' });
      return;
    }
    await arrancar();
  },


  personalNome(f) {
    const nome = txt(campo(f, 'nome'));
    if (!nome) return;
    db.personal = { id: novoId(), nome };
    if (!salvarDados()) return;
    gravarSessao({ papel: 'personal' });
    ir({ tela: 'personal' });
  },

  config(f) {
    db.config = {
      ...(db.config || {}),
      pix: {
        chave: txt(campo(f, 'chave')),
        nome: txt(campo(f, 'nome')),
        cidade: txt(campo(f, 'cidade')),
      },
    };
    if (!salvarDados()) return;
    ir({ tela: 'personal' });
  },

  perguntas(f) {
    const linhas = campo(f, 'perguntas').split('\n').map(txt).filter(Boolean);
    if (!linhas.length) { avisar('Deixe pelo menos uma pergunta.'); return; }
    const atuais = perguntasAnamnese();
    db.config = {
      ...(db.config || {}),
      perguntasAnamnese: linhas.map(texto => {
        const igual = atuais.find(p => p.texto === texto);
        return { id: igual ? igual.id : novoId(), texto };
      }),
    };
    if (!salvarDados()) return;
    ir({ tela: 'personal' });
  },

  alunoNovo(f) {
    const nome = txt(campo(f, 'nome'));
    if (!nome) return;
    const aluno = { id: novoId(), nome, codigo: codigoAluno(), criadoEm: new Date().toISOString() };
    db.alunos.push(aluno);
    if (!salvarDados()) return;
    ir({ tela: 'alunoDetalhe', alunoId: aluno.id });
  },

  recado(f) {
    const a = alunoPorId(rota.alunoId);
    if (!a) return;
    a.recado = txt(campo(f, 'recado'));
    if (!salvarDados()) return;
    render();
  },

  alunoLogin(f) {
    const codigo = txt(campo(f, 'codigo')).toUpperCase();
    const aluno = db.alunos.find(a => a.codigo === codigo);
    if (!aluno) {
      avisar('Código não encontrado. Confira com seu personal.');
      return;
    }
    gravarSessao({ papel: 'aluno', alunoId: aluno.id });
    ir({ tela: 'alunoHome' });
  },

  exercicio(f) {
    const nome = txt(campo(f, 'nome'));
    if (!nome) return;
    const dados = {
      nome,
      grupo: campo(f, 'grupo'),
      video: linkSeguro(txt(campo(f, 'video'))),
      descricao: txt(campo(f, 'descricao')),
    };
    const id = campo(f, 'id');
    const existente = id ? db.exercicios.find(x => x.id === id) : null;
    if (existente) Object.assign(existente, dados);
    else db.exercicios.push({ id: novoId(), ...dados });
    if (!salvarDados()) return;
    ir({ tela: 'exercicios' });
  },

  pagamento(f) {
    const a = alunoPorId(rota.alunoId);
    if (!a) return;
    const dia = Math.round(numero(campo(f, 'dia'), 0));
    a.pagamento = {
      valor: txt(campo(f, 'valor')),
      dia: dia >= 1 && dia <= 31 ? String(dia) : '',
      meses: (a.pagamento && a.pagamento.meses) || [],
    };
    rota.pixCodigo = '';
    if (!salvarDados()) return;
    render();
  },

  avaliacao(f) {
    const alunoId = rota.alunoId;
    const tipo = campo(f, 'tipo');
    const modelo = MODELOS_AVALIACAO[tipo];
    if (!modelo || !alunoPorId(alunoId)) return;
    const campos = {};
    modelo.campos.forEach(([k]) => { campos[k] = txt(campo(f, k)); });
    const av = {
      id: novoId(),
      alunoId,
      tipo,
      data: campo(f, 'data') || dataHoje(),
      campos,
      fotos: fotosTemp.slice(),
      criadoEm: new Date().toISOString(),
    };
    db.avaliacoes.push(av);
    if (!salvarDados()) {
      db.avaliacoes = db.avaliacoes.filter(x => x.id !== av.id);
      return;
    }
    fotosTemp = [];
    ir({ tela: 'avaliacoes', alunoId });
  },

  anamnese(f) {
    const alunoId = rota.alunoId;
    if (!alunoPorId(alunoId)) return;
    const respostas = {};
    perguntasAnamnese().forEach(p => { respostas[p.id] = txt(campo(f, p.id)); });
    const existente = db.anamneses.find(x => x.alunoId === alunoId);
    if (existente) {
      existente.respostas = respostas;
      existente.data = dataHoje();
    } else {
      db.anamneses.push({ id: novoId(), alunoId, data: dataHoje(), respostas });
    }
    if (!salvarDados()) return;
    ir({ tela: 'avaliacoes', alunoId });
  },
};

// ---------- eventos (delegação) ----------

function preencherVideo(campoNome, ex) {
  const nome = txt(ex.nome).toLowerCase();
  const achado = db.exercicios.find(x => x.nome.toLowerCase() === nome);
  if (!achado || !achado.video || txt(ex.video)) return;
  ex.video = achado.video;
  const campoVideo = campoNome.closest('.cartao').querySelector('[data-exc="video"]');
  if (campoVideo) campoVideo.value = achado.video;
}

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-acao]');
  if (el && acoes[el.dataset.acao]) acoes[el.dataset.acao](el);
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.campo && rascunho) rascunho[t.dataset.campo] = t.value;
  if (t.dataset.exc && rascunho) {
    const ex = rascunho.exercicios[Number(t.dataset.idx)];
    if (ex) {
      ex[t.dataset.exc] = t.value;
      if (t.dataset.exc === 'nome') preencherVideo(t, ex);
    }
  }
  if (t.dataset.real && execucao) {
    const s = execucao.series[t.dataset.ex];
    if (s && s[Number(t.dataset.j)]) {
      s[Number(t.dataset.j)][t.dataset.real] = t.value;
      gravarExecucao();
    }
  }
  if (t.hasAttribute('data-fb') && execucao) {
    execucao.feedback = t.value;
    gravarExecucao();
  }
});

app.addEventListener('submit', (e) => {
  e.preventDefault();
  const nome = e.target.dataset.form;
  if (formularios[nome]) formularios[nome](e.target);
});

app.addEventListener('change', async (e) => {
  const campoArquivo = e.target;

  if (campoArquivo.dataset.modelo !== undefined) {
    aplicarModelo(campoArquivo.value);
    return;
  }

  if (campoArquivo.hasAttribute('data-foto')) {
    const arquivos = [...campoArquivo.files];
    const status = document.getElementById('fotos-status');
    fotosTemp = [];
    if (status) status.textContent = arquivos.length ? 'Preparando as fotos...' : 'Nenhuma foto escolhida.';
    try {
      for (const arquivo of arquivos) fotosTemp.push(await comprimirFoto(arquivo));
      if (status) status.textContent = fotosTemp.length + ' foto(s) pronta(s).';
    } catch (err) {
      fotosTemp = [];
      avisar('Não consegui ler uma das fotos. Tente outra.');
      if (status) status.textContent = 'Nenhuma foto escolhida.';
    }
    return;
  }

  if (campoArquivo.dataset.backup !== 'restaurar') return;
  const arquivo = campoArquivo.files[0];
  campoArquivo.value = '';
  if (!arquivo) return;

  let novo = null;
  try { novo = JSON.parse(await arquivo.text()); } catch (err) { novo = null; }
  if (!dadosValidos(novo)) { avisar('Esse arquivo não é um backup do Treino.'); return; }
  if (!(await pedirConfirmacao('Restaurar? Os dados atuais deste aparelho e da sua conta serão substituídos pelos do arquivo.'))) return;

  db = {
    personal: novo.personal || null,
    alunos: novo.alunos,
    treinos: novo.treinos,
    sessoes: novo.sessoes,
    exercicios: Array.isArray(novo.exercicios) ? novo.exercicios : [],
    anamneses: Array.isArray(novo.anamneses) ? novo.anamneses : [],
    avaliacoes: Array.isArray(novo.avaliacoes) ? novo.avaliacoes : [],
    config: novo.config && typeof novo.config === 'object' ? novo.config : {},
  };
  if (!salvarDados()) return;
  execucao = null;
  gravarExecucao();
  gravarSessao(null);
  avisar('Backup restaurado.');
  ir({ tela: 'inicio' });
});

btnSair.addEventListener('click', () => acoes.sair());
descansoMais.addEventListener('click', () => ajustarDescanso(15));
descansoPular.addEventListener('click', pararDescanso);

// ---------- início ----------

function iniciar() {
  if (sessao && sessao.papel === 'personal' && db.personal) {
    rota = { tela: 'personal' };
  } else if (alunoLogado()) {
    rota = execucao && execucao.alunoId === sessao.alunoId
      ? { tela: 'treinoRealizar' }
      : { tela: 'alunoHome' };
  } else {
    gravarSessao(null);
    rota = { tela: 'inicio' };
  }
  if (execucao && !db.treinos.some(t => t.id === execucao.treinoId)) {
    execucao = null;
    gravarExecucao();
  }
  render();
}

arrancar();
  </script>
