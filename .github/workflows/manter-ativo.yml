name: Manter o banco ativo

# O Supabase gratuito pausa o projeto depois de uma semana sem uso.
# Esta consulta leve roda a cada 3 dias para o projeto continuar ativo.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no Supabase
        run: |
          curl -fsS -X POST "https://uhywfpwkkktpmtqgkpbe.supabase.co/rest/v1/rpc/manter_ativo" \
            -H "apikey: sb_publishable_Kr6fIQc7kE040GfuWvndcw_inhGTI9Q" \
            -H "Content-Type: application/json" -d "{}" \
            -o /dev/null -w "HTTP %{http_code}\n"
